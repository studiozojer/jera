build:
  name: Jera public Exact AppDrop preview
  steps:
    - eas/checkout
    - exact_archive
    - eas/upload_artifact:
        inputs:
          # EAS uploads from the checkout root; the Exact project lives in app/.
          path: app/artifacts/jera.ipa
          type: application-archive
functions:
  exact_archive:
    name: Build device IPA for AppDrop signing
    path: ./exact-archive
